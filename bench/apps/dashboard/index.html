<!doctype html><html><head><meta charset="utf-8"><title>Dashboard</title><link rel="stylesheet" href="shared.css">
<style>
body { padding: 14px; display: grid; grid-template-columns: repeat(2, 1fr); grid-auto-rows: 1fr; gap: 12px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; min-height: 0; }
.panel h2 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: 600; } canvas { flex: 1; width: 100%; min-height: 0; }
</style></head><body>
<div class="panel"><h2>Requests / s</h2><canvas></canvas></div><div class="panel"><h2>Latency (ms)</h2><canvas></canvas></div>
<div class="panel"><h2>Errors</h2><canvas></canvas></div><div class="panel"><h2>Queue depth</h2><canvas></canvas></div>
<script>
const series = [...document.querySelectorAll('canvas')].map(() => Array.from({ length: 120 }, () => Math.random()));
function draw(canvas, data) {
  const dpr = devicePixelRatio, w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const g = canvas.getContext('2d'); g.scale(dpr, dpr);
  g.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent'); g.lineWidth = 1.5; g.beginPath();
  data.forEach((v, i) => { const x = (i / (data.length - 1)) * w, y = h - v * h * 0.9 - 2; i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.stroke();
}
setInterval(() => {
  document.querySelectorAll('canvas').forEach((c, i) => { const d = series[i]; d.shift(); d.push(Math.max(0, Math.min(1, d[d.length - 1] + (Math.random() - 0.5) * 0.2))); draw(c, d); });
}, 1000);
</script></body></html>
