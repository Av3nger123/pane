name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/electron
      - run: npm test

      # Ubuntu 24.04 blocks the user namespaces Chromium's sandbox needs.
      - name: Allow Chromium's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Smoke test (opens a real window)
        if: runner.os != 'Linux'
        run: npm run smoke
      - name: Smoke test (opens a real window, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke

  templates:
    name: Templates and the Notes example
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/electron
      - run: npm run test:templates
      - name: Notes example (a real app on Pane)
        run: npm run test:notes

  installers:
    name: Installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/electron
      - run: npm run test:installers
      - run: npm run test:signing
      - run: npm run test:updates
      - run: npm run test:keychain
        if: runner.os == 'macOS'
